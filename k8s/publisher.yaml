apiVersion: apps/v1
kind: Deployment
metadata:
  name: publisher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: publisher
  template:
    metadata:
      labels:
        app: publisher
    spec:
      containers:
        - name: publisher
          image: kafkaproj:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BROKER_HOST
              value: "kafka-0.kafka"
            - name: TOPIC
              value: "ordini"
            - name: DELAY
              value: "1"
            - name: NUM_PARTITIONS
              value: "5"
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "publisher $POD_NAME -> $BROKER_HOST (rotazione su $NUM_PARTITIONS partizioni)"
              i=0
              p=0
              while true; do
                i=`expr $i + 1`
                ./publisher "$BROKER_HOST" 9092 "$TOPIC" "ordine $i da $POD_NAME" "$p" \
                  || echo "produce fallito, riprovo"
                p=`expr $p + 1`
                if [ "$p" -ge "$NUM_PARTITIONS" ]; then p=0; fi
                sleep "$DELAY"
              done
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"