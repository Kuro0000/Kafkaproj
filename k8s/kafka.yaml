apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app: kafka
spec:
  clusterIP: None
  selector:
      app: kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
    - name: metrics
      port: 9100
      targetPort: 9100

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka
  replicas: 2
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: kafka
          image: kafkaproj:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ "$(hostname)" = "kafka-0" ]; then
                export REPLICA_HOST=kafka-1.kafka.default.svc.cluster.local
                export REPLICA_PORT=9092
              fi
              exec ./broker
          ports:
            - name: kafka
              containerPort: 9092
            - name: metrics
              containerPort: 9100
          readinessProbe:
            tcpSocket:
                port: 9092
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: data
              mountPath: /app/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi