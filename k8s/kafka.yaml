apiVersion: v1
kind: Pod
metadata:
  name: kafka-pod
spec:
  clusterIP: None
  selector:
    matchLabels:
      app: kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092

---
apiVersion: app/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka
  replicas: 2
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: 
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9092
            - name: kafka
          volumeMounts:
            - name: data
              mountPath: /app/data
volumeClaimsTemplate:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi